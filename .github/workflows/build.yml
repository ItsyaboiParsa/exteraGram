name: Build exteraGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties with API credentials
        run: |
          echo "APP_ID=6" > local.properties
          echo "APP_HASH=\"eb0669018641a998c0d9a6c7694f4c4a\"" >> local.properties
          echo "APP_ID=6" > TMessagesProj/local.properties
          echo "APP_HASH=\"eb0669018641a998c0d9a6c7694f4c4a\"" >> TMessagesProj/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Release/Debug)
        run: ./gradlew assembleafroditeRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraGram-CustomFont-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
